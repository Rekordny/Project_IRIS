l_simp_chinese:

 LOADING_TIP_0: "露西意志\n\n由于前文明的毁灭，现文明生命从基因上天生带有对玛娜以及自然的亲和，除非遭受后天影响，否则每一个生命都将自发的选择以玛娜作为生活方式。"
 LOADING_TIP_1: "玛娜术士\n\n对人类中那些玛娜适应力强大，能够自发的凝聚玛娜的人的称呼。人类的玛娜术士水平差距极大，其中大多无法与异种抗衡，有些则可以媲美。而在所有术士之上是名为神话术师的存在，他们的力量甚至连异种也无法企及。纵观人类历史一共只出现过八位，并且往往因其能力而成为领袖。"
 LOADING_TIP_2: "地脉圣地\n\n地脉圣地一般指地脉核心枢纽。圣铃兰是地脉核心圣树所在，其国土“根源之地”即是圣树在现实世界的投影所形成，其上的玛娜极其浓郁，以致于能够提高玛娜适应力，将长期在此处生存的人类族裔转化为圣树民。而赛莲斯与卡美洛则是坐落在地脉的两处节点上，当地的玛娜浓度较高，同时圣树的一抹残影在化为了圣兽与圣杯的异像"
 LOADING_TIP_3: "枯萎死土\n\n乌斯拉尔、南极洲两处的地脉因某些原因遭到毁坏，受祝铃兰难以在此地生长，在不使用玛娜结晶的情况下，此地施展的魔法将遭到极大削弱。此外有研究表明，此处的农作物产量也大幅减少。"
 LOADING_TIP_4: "铃兰\n\n起源于IRIS世界的各地的独特作物，能够从中汲取源于地脉的玛娜，是早期国家用于提取玛娜的原始作物。但其生长受地脉影响极大。地脉受损将会导致整片地区的铃兰集体枯萎。"
 LOADING_TIP_5: "受祝铃兰\n\n来自于根源之地的根系连接地脉的独特作物，能够提高空气中玛娜的含量。也是提取玛娜最便捷高效的原料。但其生长受地脉影响极大。地脉受损将会导致整片地区的受祝铃兰集体枯萎。"
 LOADING_TIP_6: "地脉\n\n连接整个世界的能量网络，庞大的玛娜如同血管里的鲜血一样奔流其中，是自然意志感知世界与接收请求的通道，在各地区活跃程度有所不同。最为极端的区域被称为“地脉圣地”或是“枯萎死土”。工业建设会阻碍地脉通路，削减当地的空气玛娜含量，但可以通过种植受祝铃兰等手段修复。"
 LOADING_TIP_7: "玛娜\n\n一种独特的能量物质，表现为流离在世界各处的因子。能作用于物质世界，使魔法与神话现象成为现实。其本质是生命体对自然意志进行请求的媒介物质。"
 LOADING_TIP_8: "玛娜结晶\n\n现代玛娜派国家运作的根基，在2609年由圣铃兰大祭司发现，并直接引发结晶革命。所有人都可以利用玛娜结晶消耗精力来施展法术进行攻击或是生产物品，实质上是变相的劳动。但只有那些玛娜术师具有提取玛娜结晶的能力，原料通常是受祝铃兰。"
 LOADING_TIP_9: "结晶革命\n\n现代玛娜派国家体制的源头，通过让平民使用玛娜结晶进行生产和以玛娜武器装备军队的方式使得劳动力与军事力不再局限于玛娜术士，大大提高生产力，结晶革命的成功使玛娜派国家成功驱逐异种，并对尚未发生工业革命的玛那匮乏国家形成完全碾压。"
 LOADING_TIP_10: "玛娜适应力\n\n操控玛娜因子的能力，直接决定了在不凭借外接玛娜的情况下使用者能施展的法术极限。在不同种族与个体间都存在极大差异。普遍来说异种要远远强于类人种。虽然尚未找到原理，但该能力的确存在改变的可能性，例如圣树民其本质就是长期处在圣树影响下玛娜适应力得到提升的人类。"
 LOADING_TIP_11: "工业派\n\n该名词直到近代工业革命后才被广泛运用，在此之前，这些人被称为反玛娜派。2818年，乌斯拉尔人托马斯·塞维利发明名为蒸汽机的机械，通过燃烧燃料产生动力的开辟之举向世人揭示了不借助玛娜，凭自我做功改变自然的可能。自此反玛娜派有了新名字——工业派。"
 LOADING_TIP_12: "反玛娜派\n\n这个和玛娜同样古老的派系并非拒绝一切玛娜活动，而是他们在身处缺乏玛那的环境下不得不做出的一种抉择：委身于强大术士的庇护或是奴役。但再强大的玛娜术士终究是人类，一旦身陨，他的领地便将沦为魔族的猎场，侥幸逃脱的之人也只能在流亡中寻找下个能够侍奉的王者。而在这种绝望的循环下，有些人的想法发生了变革，他们认定在如此差距之下，人类无法仅凭玛娜与异种为敌，依附术士也不过苟延残喘，想要战胜魔族，只能依靠双手和独属于人类的智慧。"
 LOADING_TIP_13: "战车道\n\n战车道是一种工业化生产出现后，对于装甲战车和坦克的专业化军事研习与礼仪性比试，其组织形式最开始源于中世纪西欧罗巴地区的骑士比武。随着近代战争与军事的变革，以及各种利益链条的驱动下，这种礼仪性质的比赛逐渐演变成一种带有明确工业主义倾向的政治团体。"
 LOADING_TIP_14: "卡罗尔主义\n\n2885年，卡罗尔·杜波依斯夫为乌斯拉尔工人联合作名为《正义者宣言及纲领》一文，正式提出了以工人阶级为领导，最终消灭阶级建立共产主义社会的构想。由于领导工人运动，卡罗尔于四年后被乌斯拉尔驱逐出境，他走遍欧罗巴诸国进行考察最终定居思边故区，老年的他经过总结又写下诸多著作，最终形成后世所谓的卡罗尔主义。"
 LOADING_TIP_15: "亚历山大文明\n\n亚历山大文明，是指在漫长的历史进程中由亚历山大人所创造并延续的一系列相关文明形态的总称。它并非单一而静止的实体，而是一个跨越时代、持续演变的璀璨谱系。从早期的城邦与王国，到鼎盛时期的庞大帝国与联盟，乃至后来那些或依然独立存在、或已消散于时光中的各具特色的文化实体——皆属于这一宏大文明的范畴。"
 LOADING_TIP_16: "亚历山大人（根源历14世纪中叶-1423年）\n\n亚历山大人并非一个确切的单一民族，而是指在亚历山大东征的旗帜下汇聚的人类诸部。在漫长的历史进程中，各部族通过血脉与文化的交融，逐渐形成了共通的言语、信仰与民族认同。狭义上，“亚历山大人”特指那些跟随亚历山大东征，最终在东欧罗巴地区定居并建立根据地的人类后裔，与后来的人类诸国血脉没有直接联系。"
 LOADING_TIP_17: "IRIS什么时候转战CK3\n\n——锦户千华"
 LOADING_TIP_18: "后亚历山大东欧人（根源历1423年-17世纪？）\n\n亚历山大发起的“大远征”曾将人类的势力范围一度推进至魔族盘踞的东欧罗巴腹地。然而随着远征最终失败，魔族卷土重来，东欧罗巴与人类文明世界再度隔绝。那些滞留于此的亚历山大人后裔，自此走上了截然不同的道路：有人臣服于魔族的统治，在残酷压迫中沦为牲畜；有人向荒僻之地迁徙，试图在边缘之地延续火种；亦有人组织起最后的抵抗，在绝望中发起注定悲壮的斗争……"
 LOADING_TIP_19: "后亚历山大时代（根源历1423年-15世纪末？）\n\n“后亚历山大时代”指从首位人类神话玛那术士“亚历山大大帝”逝世，到东欧罗巴人类领地完全覆灭之间的一段历史时期。“诸国时代”并非严格承接于这一时代之后，而是与之存在一段重叠与交融的过渡阶段。该概念主要用于考察亚历山大文明的发展脉络，并非一般意义上的欧罗巴历史分期框架。随着完整亚历山大文明逐渐分崩离析，关于这一时代具体于何时终结，学界至今仍存在诸多争议……"
 LOADING_TIP_20: "镇乱帝国（根源历2113年-2164年）\n\n由人类历史记载的第二位神话玛娜术士、爱丽诺王——查理一世，建立的庞大人类帝国。帝国幅员辽阔，西起科斯特利亚，东至多瑙湖，涵盖了如今乌斯拉尔、安齐奥和爱丽诺及其周边地区的绝大领土范围，是欧罗巴历史上最庞大的人类政权。"
 LOADING_TIP_21: "驱魔战争（根源历2792年-2830年）\n\nloading_tips_l_simp_chinese由爱丽诺国王露伊十四世于根源历2792年发动的一场历经两代君主、持续近40年的漫长战争。战争以领军圣女莉莉丝特率领爱丽诺远征军进攻伊叙塔魔国为开端，途中多个魔族政权覆灭，直至最后以诗旎公国击败爱丽诺远征军为收场。这场战争不仅确立了诗旎公国东欧霸主的地位，同时也拖垮了爱丽诺的经济，间接引发了爱丽诺大革命。"
 LOADING_TIP_22: "帕夏帝国（根源历2311年-3071年）\n\n帕夏帝国是2311年由苏丹索罗门二世建立的、以土耳基人为主导的人类帝国，国名取自古老领袖尊号“帕夏”，国祚约760年。它攻灭罗姆帝国，雄踞海峡与西地中海，历经“新月王朝”、“四王之乱”与“三月王朝”等时期，最终在上次世界大战中被肢解灭亡。"
 LOADING_TIP_23: "自由合众国（根源历2941年-）\n\n自由合众国是南阿西亚东部的移民民主国家，前身为塔德里克十二自治殖民地。2928年掀起独立运动，2941年正式建立。它以“自由”为旗帜，工业与经济迅速崛起，却长期受工业自由党与农业民主党等派系争斗影响。历经路易斯安那战争，同时也是上次世界大战的胜利者，然如今却深陷黑沫夜危机……"
 LOADING_TIP_24: "圣铃兰（根源历914年-）\n\n圣铃兰，全称“根源教会与全体圣树民”，也是圣铃兰的自称；由根源教会与圣座统治。其信仰以“圣树、地脉、玛娜”三位一体为核心，自诩“世界的守护者”“尘世的守夜人”，并被铃兰系教派公认为宗教领袖。是上次世界大战的主要胜利者之一。其领土根源之地丰饶、富强，更是有着“地上天国”的美誉。"
 LOADING_TIP_25: "圣卡提亚（根源历892年-986年）\n\n根源教会首任圣座与根源骑士团缔造者，《圣典》撰写者。她借巨龙危机整合诸城邦，终结纷争时代，并以《圣树盟约》、整军令和继承令确立教权主导秩序。其功在重建和平与统一，争议则在削弱城邦自治、推动权力集中，影响深远。"
 LOADING_TIP_26: "《圣典》（根源历914年）\n\n又称《露西圣约》、《根源大典》。是卡提亚受圣树宣召、领受露西圣谕后编撰的根源教会核心文献。它以露西意志和圣树叙事为蓝本，记载预言、灾厄与救赎事迹，被卡提亚用作团结圣铃兰诸城邦、组建根源骑士团的精神旗帜。根源历914年，根源教会正是以《圣典》叙事为根基创立，对后世铃兰系教派产生了深远影响。"
 LOADING_TIP_27: "翡翠时代（根源历233年-514年）\n\n由“翡翠圣座”圣薇尔丹开创的时代，美好与田园牧歌的代名词。根源历233年，根源之地的地脉被激活，铃兰种植与神秘学兴起，从而诞生了文字与玛那术士。有史以来最早的人类政权便建立在这个时代。"
 LOADING_TIP_28: "守夜时代（根源历914年-2000年）\n\n由圣卡提亚开创的时代，根源之地正式进入由根源教会统治的神权政治。这个时期的根源教会经历了从创立到制度逐渐完善的发展过程。"
 LOADING_TIP_29: "远行时代（根源历2000年-2405年）\n\n根源教会的布道院建立正式标志着远行时代的开启，根源教会开始在圣树的选召下，将布道使团派往根源之地外，以启迪民智，开辟信仰。根源历2166年，伊斯·胡斯使团自寒堡港踏上欧罗巴的土地，圣铃兰教自此扎根于欧罗巴的土地上。"
 LOADING_TIP_30: "堕落时代（根源历2405年-）\n\n血剑仪式令乌斯拉尔地脉断绝，由此开启了圣铃兰眼中礼崩乐坏的堕落时代。自那以来，各地纷争四起，根源之地外的信仰遭到篡改与亵渎，反玛娜派与工业派兴起并将玛娜派视作敌人，而如今的我们依旧处在这个绝望的时代……"
 LOADING_TIP_31: "诗旎家族（未知时间线-）\n\n诗旎血脉源自异界摩萨大陆，是莉海拉德帝国尊崇的上位血族家族，历任家主以公爵之尊统御北境。因奇异玛那阵卷入时空乱流，整支血脉与治下加尼温坠入IRIS世界，归乡之路永绝。约四百年前，其凭借异界玛那术与古老传承强势崛起，铁骑横扫东欧罗巴，驱逐魔族，建立庞大的封建公国。"
 LOADING_TIP_32: "蓝蔷薇骑士团\n\n蓝蔷薇骑士团作为完全职业化的募兵制军团，是诗旎公国唯一常备军，直接隶属诗旎大公，仅对大公负责，无徭役成分。四百年前助公国横扫东欧罗巴；两百年前“驱魔战争”中击溃统御圣女莉莉丝特率领的爱丽诺远征军主力，间接影响爱丽诺历史进程。"
 LOADING_TIP_33: "帕夏十三将军\n\n帕夏十三将军是管理帝国军事与政治的十三位领袖级人物，每人负责统领帝国一个州的行政，并率领一支私人武装，拱卫帕夏疆域并维持本州治安。十三将军并不世袭，而是通过考试选拔候补，并在前任将军卸任后晋升。"
 LOADING_TIP_34: "十三将军会议\n\n帕夏帝国根本政治制度之一，由十三将军组成，苏丹任命议长并主持，辅佐军国要务。帝国崩解后，会议临时接替苏丹职责，在大将军带领下主理土尔基合众将国政务，并接管巴巴里军团。然而失去苏丹权威后，内部腐败分裂、外部革新呼声不断，统治根基动摇让十三将军会议难以继续维系政务。"
 LOADING_TIP_35: "圣女教导会（根源历2794年-）\n\n又称圣女国教会，驱魔战争时期取代洛蒂安公教（即以洛蒂安教廷为核心的圣铃兰教）成为爱丽诺国教。国王露伊十四公开皈依，献出帕莉丝北部土地建立中央教母大区。教导会宣扬国王为“艾莉斯弥赛亚”永生侍从附体，以东征魔族为使命，以圣贞德旗帜为象征，在艾莉斯大教堂由首席大教母主持，以宣布圣女的降临。"
 LOADING_TIP_36: "洛蒂安公教（根源历2169年-）\n\n全称“圣铃兰洛蒂安教廷”，别称“洛蒂安圣教”、“圣铃兰教”。随着铃兰教流入安齐奥地区，其前身“圣铃兰公教会”在2169年于罗曼地区发起，首任大主教获得安齐奥世俗王国的庇护，在伯罗妮娅建立主教座，并在后续直接或间接影响着安齐奥乃至整个欧罗巴地区的宗教与政治格局。"
