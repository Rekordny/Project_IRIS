 LOADING_TIP_39: "写代码太好玩了\n\n——洗不白的衣服"
 LOADING_TIP_40: "我已经写不出温柔的东西了\n\n——Rekordny"
 LOADING_TIP_41: "新亚历山大王国（根源历1454年-1596年）\n\n由穿越“彼岸洋”的亚历山大远征军所建立的国家，他们追随着欧迈尼斯离开战乱的欧罗巴，最终抵达了他们的国王也未曾踏足的土地。虽然该国与罗姆帝国一脉相承，但史学界依旧以皮洛士称帝为界将根源历1597年之前划分为“继业者王国时代”。"
 LOADING_TIP_42: "罗姆帝国（根源历1454年-至今）\n\n亚历山大的继业者，历史最为悠久的人类帝国之一，其前身为新赫拉斯王国，于根源历1597被皮洛士皇帝升格为帝国。虽然其核心地区已于24世纪被帕夏人占领，但罗姆帝国以塔德里克行省为核心在阿西亚东南部重新建立了统治，其国祚延续至今。"
 LOADING_TIP_43: "罗姆帝国元老院\n\n由新赫拉斯王国时期的“军民议政会”发展而来的帝国咨询和立法机构，分为常设会议和全体会议。每年的三月和十月各召开一次全体会议，按惯例三月会议处理民政司法，十月会议则审议次年预算。全体会议休会期间由常设会议处理事务。元老院成员不限民族，只要在有过五年服役经验或在各省行政机构服务八年者均可入选。"
 LOADING_TIP_44: "贡子制\n\n由阿莱克修斯皇帝建立的制度，罗姆帝国将会定期征召年满十四周岁的异族青年，将其集中到君士坦丁堡，他们将系统性地接受罗姆文化和军事教育，在年满十八岁后将根据能力分配至不同机构服务，除正常薪资收入外，贡子及其家庭均享受免税特权。贡子主要来源为被俘的帕夏远征军后人以及被帝国征服的当地民族，在合众国独立前还包含欧罗巴移民。"
 LOADING_TIP_45: "新月远征\n\n由帕夏帝国发起的数次大规模军事行动，旨在消灭撤离科斯坦丁的罗姆残余势力，并探索未知的南方荒原。但由于风暴和瘴气，有历史记载的五次远征均无功而返，苏丹本人也在最后一次远征中驾崩，被后世研究者认定为新月王朝衰落的重要原因。"
 LOADING_TIP_46: "《丹沃条约》\n\n根源历2958年，罗姆帝国在腓力波利斯会战中击败自由合众国，双方缔结和平条约，并划定国界“塞琉古线”。该条约10年续签一次，是维系两国和平的重要文件，但是对于西部的争议领土和海上边界并未做出明确划分。"
 LOADING_TIP_47: "恩库伦魔族王国（未知-根源历2360年）\n\n诞生于阿西亚北方极寒地区的魔族王国，一度拥有极其发达的附魔技术，其中高阶魔族尤擅冰雪魔法。恩库伦王国在与罗西亚人的战争中逐渐衰落，并最终走向灭亡。失去高阶魔族统御的今日，恩库伦魔族已经成为了一个历史名词，沦为退化为野兽的极地生物。"
 LOADING_TIP_48: "恩库伦战争\n\n古罗西亚邦联和北方恩库伦魔族王国之间长达二百余年的战争，最终以罗西亚人在圣铃兰传教士的帮助下战胜魔族告终。根源历2360年，“白衣”西里尔率军攻占恩库伦王都，魔族势力从此在阿西亚大陆销声匿迹。"
 LOADING_TIP_49: "科尔伦琴三部西迁（根源历24世纪）\n\n为躲避白灾，科尔伦琴三部在长子巴尔哥、次子帖木儿和幼子霍巴尔的带领下先后从旷原迁入邵伊尔河下游草原，并形成三个松散政权。前两者最终被罗西亚帝国灭亡，霍巴尔部则成为附庸，是为今日霍巴斯克人的先祖。"
 LOADING_TIP_50: "3077年大革命\n\n由青年八月党、北方舰队和帝国陆军近卫第三步兵师等单位发起的武装起义，旨在夺取沙皇格勒等主要城市，颁布宪法、建立君主立宪制。革命最终因缺乏统一指挥而迅速失败，但是其残部撤退至索穆斯行省，在八月党左派分支的带领下继续革命。"
 LOADING_TIP_51: "赫萝西查自由市\n\n罗西亚帝国纷繁复杂的行政建制中的又一个特例，是帝国唯一一个以瓦兰吉人后裔为主体民族的“自由市”，拥有相当高的自治权和地方立法权。因为其宽松的环境，该市经常成为自由派和共和派的重要据点。"
 LOADING_TIP_52: "东方牧首区\n\n罗西亚帝国名义上的正教会自治区，但自根源历3070年以来就沦为正教会大牧首拉斯普京的私人封邑。但由于牧首区高度依赖东方大铁路的物资供给，沙皇依旧可以维持对于东方地区的有效控制。"
 LOADING_TIP_53: "织田幕府（根源历2816年-）\n\n织田幕府，正式名称为“早樱国”，是位于涤圣海的一个二元政治体制国家。织田幕府结束了近三百年的战国时代，并通过改革使早樱维持近二百年的和平稳定。然日久承平，自3053年被迫开国后，内忧外患不断，虽在世界大战中得以保全，但黑沫夜亦重创了早樱的经济，维新的呼声日渐高涨…"
 LOADING_TIP_54: "徐福（未知-）\n\n徐福是相传上古时期从赛莲斯抵达早樱的渡来方士，在佐嘉民间传说中，徐福原是为始皇帝寻找不死仙丹出海，却意外登陆早樱，他于此地教化百姓，并率领人类抗击乌塔利魔族。在传说的最后，徐福击败乌塔利之王后隐居于佐嘉，因此当地仍然保留了相当完整的徐福崇拜。"
 LOADING_TIP_55: "大结界\n\n相传为初代神皇于列岛东南部设立的圣地，受七色万花筒般的屏障保护。自初代神皇立下规矩以来，历代神皇选举都于此地举行，由神秘不老的巫女莲华保护，通过寻常手段无法涉足。"
 LOADING_TIP_56: "神皇制度\n\n神皇制度起源于上古部族共主传统。最初，神皇由各部公推的巫女担任，并在大结界内通过公开竞赛选拔。历经两千余年的演变，如今的神皇选举由99名代表各自地区民众的誓约人，在大结界进行间接选举。尽管神皇被剥夺了军政大权，但其作为国家法理源头与元首的地位，神圣且不可侵犯。"
 LOADING_TIP_57: "南北朝（根源历2333年-2395年）\n\n南北朝是指早樱中古历史中国家分裂、两位神皇并立的动荡时代，起因为长期把持神皇之位的南方神官集团忌惮北方的强力候选人，故而操纵选举，使南方候选人以微弱优势获胜，不服的北方代表返乡后宣布自立神皇，战争旋即爆发。战事需求催生出转职军人——武士阶层，最终战争以北朝神皇统一全国告终。"
 LOADING_TIP_58: "幕府（根源历2395年-）\n\n幕府是早樱的政体，“幕府”一词最早诞生于2395年北朝完成统一后。战后北朝神皇为安置功勋武士、平衡各方势力，首创幕府作为军事指挥机构，并指定征夷大将军统领武士阶层。幕府在法理上仍奉神皇为最高权威，但因掌握军队与行政资源，逐渐成为早樱政治中不可忽视的实际权力中心。"
 LOADING_TIP_59: "战国时代（根源历2514年-2816年）\n\n战国时代是早樱历史上全国割据混战的历史阶段。起于2514年神皇欲借将军继嗣之故收回权力，遂任命弱主继任将军，各地武士对此不满，双方矛盾最终激化为武装冲突，十余年的混战使中央政府彻底瘫痪，各地大名纷争不断。最终，织田家凭借军事才能及圣铃兰传教士带来的结晶革命技术成功统一早樱。"
 LOADING_TIP_60: "大政委任论（根源历29世纪-）\n\n大政委任论是织田幕府时期为解决并论述神皇与将军间的关系而提出的一种政治理论，后被幕府官方采用。该理论主张早樱的“大政”归属于神皇，将军并非篡夺皇位，而是受神皇之委任，代为治理早樱。该理论在名义上实现了“尊王”与幕府执政的逻辑自洽。开国后，该理论为王政复古派所用，成为要求幕府将大政奉还给神皇的理论基础。"
 LOADING_TIP_61: "幕藩体制\n\n幕藩体制是2816年织田家结束战国乱世后独创的行政体系。其核心在于推行“神武共存”政策，织田家废除了旧神官世袭的行政特权，将地方领地转化为“藩国”，并将藩国治理权交还给由当地民众推举的偶像团体，并通过垄断海外贸易，强制要求偶像藩主定期赴京“参勤交代”以维系统治。"
 LOADING_TIP_62: "参勤交代\n\n织田幕府制约地方大名的一项制度。各藩藩主或家臣须定期率队前往京州向征夷大将军汇报政务与地方财政，幕府以此手段强化集权并确认幕藩主从关系。"
 LOADING_TIP_63: "藩国选举制\n\n又称“偶像选战”，是早樱地方自治的核心制度。经织田幕府确立幕藩体制后，早樱藩主大多均为兼具宗教领袖、世俗领主与地方偶像代表于一身的特殊存在。各藩通常每五年举行一次选举，推举出负责政务的偶像团体，最终由礼乐奉行所与幕府予以确认。"
 LOADING_TIP_64: "御前试合（根源历30世纪-）\n\n早樱最高规格的全国性偶像竞赛，由礼乐奉行所每四年统筹举办一次。各藩参赛队伍将历经地方预选与淘汰赛，最终决赛于京州皇居内举办，并由神皇亲自莅临观战，胜者获赐“国士无双”的荣誉称号。"
 LOADING_TIP_65: "光文（根源历3040年-）\n\n早樱自3040年光文神皇即位起使用的纪年年号。光文时代是早樱由近世向现代国家转变的历史时期，该时期早樱经历了开放国门、签订不平等条约、王政复古派起义、世界大战与3086年黑沫夜等重大历史事件，随着北方尊王派与南方共和派相继兴起，国内政局在光文末年日趋动荡。"
 LOADING_TIP_66: "佩里叩关（根源历3053年）\n\n佩里叩关，又称黑船来航，是指3053年夏自由合众国海军司令佩里率舰队驶入五河港，强迫早樱开国的事件，通常被视作早樱现代史的开端。佩里递交国书后严令幕府迅速答复，否则将派兵攻打京州，最终病弱的将军织田信秀与合众国签订《早樱-合众国亲善通商条约》，是为早樱不平等条约之始。"
 LOADING_TIP_67: "《早樱-合众国亲善通商条约》（根源历3053年）\n\n3053年早樱国（织田幕府）与自由合众国缔结的不平等条约，又称《五河条约》。条约中主要规定在锁国期间幕府开放的东云、佐嘉两港的基础上，早樱必须额外开放五港，总计七大港口与合众国通商，并要求于平户设立领事馆和居留地，及片面最惠国待遇等。"
 LOADING_TIP_68: "军事化藩国（根源历3070年代-）\n\n军事化藩国是指早樱开国后逐渐由世俗官僚和军人把持藩政的特殊政体。这一体制的壮大得益于世界大战与扩充海防的需求，军工产业的落地和民间武装的壮大促使军官与技术官僚逐步掌握了地方实权。目前，早樱的军事化藩国为南方的鹿儿藩、岛田藩。"
 LOADING_TIP_69: "壬生浪士（根源历3067年-3070年）\n\n壬生浪士是清河八郎以“招募英才参战以将功补过”为由组建的一支浪人武装，原名“浪士组”。清河原打算利用所招浪人趁战乱之际进京发动政变，经实战派告密，幕府监察官员佐佐木只三郎以决斗方式将清河斩杀。其余队士经佐佐木担保，被信长派往南方战场支援，战后被改编为“新选组”。"
 LOADING_TIP_70: "新选组（根源历3070年-）\n\n前身为世界大战期间抵御外敌的民间武装“壬生浪士”，战后被信长正式收编为精锐近卫。内部因出身与政见逐步分化为土方岁三、近藤勇主导的试卫馆系、芹泽鸭率领的逍遥系及伊东甲子太郎的御陵卫士系。"
 LOADING_TIP_71: "攘夷志士（根源历3068-3070年；3078年-）\n\n攘夷志士是活跃于早樱南方的共和派革命结社。“攘夷志士”之名源自桂小太郎等人于世界大战期间组织的部队番号，3078年重组后逐渐整合其他共和团体，成为南方共和派的统称。尽管内部派系林立，但“推翻幕府，建立共和政体”的基本目标是所有志士的共识。"
 LOADING_TIP_72: "海援队（根源历3072年-）\n\n由浪人坂本辰马与赛莲斯佣兵陆奥共同创立的武装商业船队。遭仇家暗算的坂本辰马被罗姆贩奴船打捞上岸，坂本凭借船上内讧发动起义，率奴隶们劫船回到早樱，并以此为班底创建了海援队，该组织长期游走于灰色海域从事军火贸易和物资走私，自3082年起加盟攘夷志士，为其提供装备和经费。"
 LOADING_TIP_73: "春雨（根源历3077年-）\n\n春雨（Tshun-yu），是世界大战后活跃于西大洋海域的一支海盗集团，陆上总部位于莲门租界，主要活跃于赛莲斯、早樱及合众国之间的海域，从事走私货物、贩卖毒品、人口拐卖、雇佣军等非法产业。春雨没有任何政治立场，作为一个纯粹的暴力集团，只要出价合适，春雨便会提供所需的服务。"
 

