#修正
 NIS_kirihara_frontier_dynamic_modifier: "音乃藩雾原经略府"
#精神
 NIS_school_idol_wave: "学园偶像浪潮"
 NIS_school_idol_wave_desc: "\n\n\n£NIS_school_idol_wave_topbar\n\n\n\n\n自3060年代起，音乃藩便率先在领内推广新学、兴办学校，为巫女偶像的近代化转型奠定了基础。3084年，§SUTX学园§!的§1A-RISE§!以全新的魔导演艺在偶像选战中大胜后，一场名为§C学园偶像§!的青春风暴迅速以音乃木坂为中心，席卷了北方诸藩。\n\n在3089年的新一轮选举中，以高坂穗乃果等人组建的§iμ's§!为首，一批批受A-RISE感召的北方少女纷纷以学园偶像的身份登上藩主宝座。如今，作为这一潮流的发源地，活跃于音乃木坂校园与演舞场的少女们正以歌声汇聚起万千民众的意志，将早樱引领向崭新的未来。"
 NIS_hokuriku_hitto: "北方诸藩之首"
 NIS_hokuriku_hitto_desc: "\n\n\n£NIS_hokuriku_hitto_topbar\n\n\n\n\n2816年织田幕府推行领地合并时，便将封地最广袤的音乃藩尊为§Y北方诸藩之首§!。百余年间，音乃藩不但在御前试合中屡获佳绩，还数次从中斡旋调解各藩争端，在北陆享有极高的威望与号召力。\n\n然而，这份荣誉同样伴随着沉重的责任——无论是幕府的苛捐杂税，还是周边诸藩寻求援助的殷切目光，皆第一时间落在了这北境首藩的肩上。而在动荡的当今天下，这份跨越百年的底蕴，也正成为将年轻的学园偶像们紧密团结在一起的§i纽带§!..."
 NIS_otono_system: "音乃藩体制"
 NIS_otono_system_desc: "2816年织田幕府将南北相隔千里的§i音乃木坂§!与§D雾原§!强行合并后，地理的割裂与人口悬殊曾让北部民众长期深感边缘化，甚至数次引发骚动。\n\n为化解分裂危机，音乃藩主于2950年代上书幕府获准设立§D雾原经略府§!，由此定下了史称§C雾原处分§!的定制：经略府在法理上尊奉音乃藩主、对外共用藩国名义，内部则享有独立的行政与司法自治权。这套§C共戴一主、南北分治§!的独特体制虽未能根本解决首府政令统筹问题，但依旧维系了音乃藩百余年的安稳与繁荣。"
