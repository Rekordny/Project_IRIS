 NIS_kirihara_frontier_tooltip_scripted_loc_2: "§C音乃藩雾原经略府§!\n - 适役人口：§G+5.00%§!\n - 本地补给：§G+10.00%§!\n - 本地防御：§G+10.00%§!\n\n\n\n\n\n\n\n£NIS_kirihara_frontier_commission_2_kaho_sayaka\n\n\n\n\n\n\n\n\n§Y雾原经略使 & 经略副使§!：\n日野下 花帆 & 村野 沙耶香\n\n执政团体：§r莲之空女学院学园偶像俱乐部§!"
 NIS.1.t: "可是可是太无情"
 NIS.1.desc: "“号外！号外！神皇陛下已于先日崩御——”街上报贩的叫卖声渐渐飘进音乃藩邸的主厅。妮可摆出一副城府极深的模样坐在主位旁：“相信大家都看到今天的报纸了。神皇驾崩了，你们知道这意味着什么吗？”南小鸟小声答道：“代表我们应该悲伤自肃吧？”妮可闻言翻了翻白眼，转头满怀期待地看向藩主穗乃果。穗乃果想了想，高高举起手，“我知道！意味着我们要投出一个新皇！”\n\n“你们太散漫了！”妮可猛地拍桌起身，“这意味着我们的时代终于到了呀！”“诶？”众人不约而同发出疑惑。“按照古制，神皇自古就是全早樱最强的偶像对吧？”妮可竖起食指，“我们μ's既然击败了A-RISE，那就是名副其实的当代最强！不去竞选神皇简直天理难容！所以——穗乃果，就由你代表音乃藩、甚至代表整个北方出战吧！”\n\n“等等，妮可，这种关乎国体的大事，不管怎么说也得先讨论一下…”海未连忙制止妮可的爆炸性发言。绘里也跟着点头附和：“没错，而且也得充分考虑下穗乃果本人的想法吧？”一瞬间，八道目光齐刷刷集中到了穗乃果身上。\n\n“我、我吗…”穗乃果抓了抓头发，试图用笑容萌混过关，“那个呀，我想的就是每天吃吃面包，和大家一起唱唱歌什么的…”“别想蒙混过去！”妮可的神情严肃起来，“难道你创建μ's的时候，就从没想过要成为最强偶像吗？”\n\n厅内骤然安静下来。穗乃果张了张嘴，却一时不知该如何作答。其实…她真的从来没想过那些。当初组建μ's，不过是为了阻止废校。如今学校保住了，只要接下来五年安心替百姓办点实事，等任期一满又能回到以前的日常。什么“神皇”“最强偶像”，对自己来说遥远得毫无实感。可看着眼前分外认真的妮可，穗乃果心里也清楚——如果直接说出“完全没想过”，一定会狠狠伤到妮可的心吧？\n\n正因不想伤害伙伴，穗乃果垂下眼帘，陷入了犹豫。但这在妮可眼里却成了“原来你心里也在动摇嘛！”的证据。“好啊！”妮可果断撂下狠话，“今天下午五点，神田明神台阶前见，我们来场比试！只要你能赢我，这件事我以后绝口不提；可如果是我赢了——你就给我好好考虑一下！”\n\n下完“战书”后，妮可便阔步摔门而去。花阳小声嘀咕：“妮可酱今天为什么突然气冲冲的，感觉好无情呢…”星空凛也跟着困惑：“完全搞不懂喵…”一旁的海未没有接话，只是转过头，神情复杂地看向坐在原地发呆的青梅竹马：“话说回来，穗乃果…你究竟知不知道，成为‘神皇’到底意味着什么？”"
 NIS.1.a: "“我…完全不清楚…”"
 NIS.2.t: "来自妮可的挑战"
 NIS.2.desc: "妮可离去后，穗乃果到底还是有些在意，便趁午休找到了队内最博学可靠的海未、绘里和希，仔细问起历代神皇的事迹。然而，得到的答案远比想象中更沉重——一旦当选神皇，就必须告别音乃木坂，前往京州皇居深居简出；身边顶多只能带两三名近臣打理内廷，至于剩下的伙伴，则必须留在音乃藩。也就是说，无论愿不愿意，原本朝夕相处的“九个人”都将注定分别。\n\n下午五点，穗乃果怀着这股挥之不去的心事踏上台阶，刚一抬头，便看见妮可正双手抱胸站在台阶顶端，微风吹起她的双马尾，那副居高临下等候多时的架势，好似一位深藏不露的隐世高手。“哼，总算来了吗，高坂穗乃果！”妮可扬起下巴，“规则就按常规跑步训练来！从石阶跑到邻街卖黄金米那家饭馆再折返，败者要愿赌服输！预备——跑！”\n\n话音未落，妮可便抢先窜了出去，穗乃果愣了半拍才连忙追赶，可心事重重的她总觉得脚步有些发沉。眼看两人一前一后即将冲过折返点，跑在前面的妮可脚下突然一绊——在黄金米店门口来了个标准的平地摔。\n\n“妮可酱！没事吧？”穗乃果吓了一跳，想都没想就立刻冲过去扶起妮可。妮可揉着发红的膝盖，抬头看着面前一脸担忧的少女，原本准备好的狠话忽然卡在了喉咙里。沉默片刻后，妮可轻叹了口气，语气温柔了下来：“…你是在害怕离开音乃木坂，害怕失去现在九人在一起的日常，对吧？”“诶？！你、你怎么知道？”穗乃果睁大了眼睛。“哪还用猜，你这笨蛋把什么都写在脸上了！”妮可撇过头嘀咕，“你以为我就想…和你分开吗？但是，这一切绝不会这么结束的！”\n\n妮可转过头，紧紧握住穗乃果的手：“听好了，这只是第一步！我早就计划好了，等时机成熟，我们还要联合其他学园偶像，让神皇真正亲政！到时候，μ's的九个人一定要一起站在最巅峰的舞台！”说完，妮可突然站起身，拍了拍裙摆上的灰尘，匆匆甩下一句“总…总之，给你半个月好好想想！”便一溜烟跑开了。\n\n街道上的灯光逐渐亮起，穗乃果站在原地，低头看着自己刚才被握住的手心。她不想辜负妮可那份比谁都更热爱偶像的心意。可一想到踏出这一步，就意味着要离开熟悉的家乡、离开“穗村”，意味着九个人没法再像现在这样每天并肩走在一起，她的心里便像是有什么东西被揪住了一样。\n\n是要为了妮可的愿望迈出这一步，还是珍惜大家现在这份平淡却珍贵的日常…向来想到什么就立刻去做的穗乃果，第一次在暮色中停住了脚步。"
 NIS.2.a: "“……再好好想想吧。”"
 NIS.3.t: "未来如风"
 NIS.3.desc: "“呜哇——————！！”\n\n一声凄厉的惨叫打破了结丘清晨的宁静，惊飞的麻雀扑棱棱地把刚扫成堆的落叶扇得满院乱飞。平安名堇眉头一跳，几乎是下意识冲进了外事办公室：“喂，大清早的你又在发什么疯啊？要不你来替我扫院子！”\n\n“出大事了，堇同学！这可是关乎世界存亡的天大的事！”唐可可手里死死攥着几张刚从走私船上卸下来的海外报纸，一把塞进堇的怀里，“你快看看这些！”\n\n“…哈？”堇疑惑地接过这摞混杂着各种语言的报纸，对着一份爱丽诺语的报道辨识了起来。这是一份来自合众国的时政评论，字里行间充斥着外国观察者的傲慢和对“学园偶像”的不屑——【早樱新皇已无悬念】、【乐队偶像的新时代】两道大字赫然印在头版，底下则是笔者评论：他认为早樱北方各自为战、票源分散，而南方除了独领风骚的坂东藩外甚至凑不出个像样的竞争者，如此看来，固守传统的北方偶像注定敌不过代表先进文化的乐队，神皇人选必将落入南方之手。\n\n“再这样下去，神皇宝座就要变成南方人的囊中之物了！”可可双手拍在桌子上，严肃说道，“一定要捍卫我们学园偶像的尊严！必须得做点什么才行！”看着可可那如临大敌的模样，堇无奈叹了口气，随即顺着她那直勾勾盯着自己的视线，故作矜持地撩了撩头发：“真是拿你没办法呢……难不成，你是想让我代表结丘出马，去和那个户山香澄一较高下？虽然以本小姐的实力，拿下神皇之位也不是不可以——”\n\n“才怪啊！谁要推你去唱《具足虫之歌》啊！”“不许提具足虫！！”\n\n吵闹过后，可可迅速收起嬉笑，从柜子里翻出一张地图分析了起来，“你听我分析，堇同学！虹咲的个人偶像虽然实力强劲，但她们光是在藩内都会互相分票，全国大选更是吃亏。至于我们结丘和南面的沼津，虽然各具特色，但终究缺少一呼百应、动员整个北方的号召力…”可可最后用手指点了点那北方诸藩之首的版图，“唯一的希望——只有那位去年奇迹般战胜了A-RISE的音乃藩主，高坂穗乃果！”堇愣了一下，抱起双臂挑眉问道：“理是这么个理，可音乃藩未必有争霸的意思，况且其他两个藩为什么要听你的？你打算怎么办？”\n\n“那还用问吗？”唐可可迅速从衣服内兜抽出一副墨镜戴上，露出一副得意的笑容，“当然是去把大家都团结起来，让全早樱见识到学园偶像的力量！第一站，就先去隔壁的虹咲藩找岚珠同学谈谈吧！”"
 NIS.3.a: "“真是胡闹…好吧，本小姐就勉为其难陪你跑一趟吧！”"
 NIS.4.t: "未来的和声"
 NIS.4.desc: "“可可——！这里这里！”\n\n刚一下车，一句操着莲门口音的赛莲斯话便从街对面传来。钟岚珠站在校门口用力挥着手，高咲侑和上原步梦也在她身后笑脸相迎。自从发去“过来串门”的电报后，可堇二人已经在车上颠沛了好几天，一路紧绷的神经总算在此刻松弛下来。\n\n“岚珠同学！好久不见——！”在异国见到老乡，可可立刻切换成家乡话，兴冲冲小跑上前，把一旁还想下车耍帅的平安名堇晾在了一边。“在早樱见面还是第一次吧？欢迎来到虹咲，先进来坐坐吧！”岚珠一挥手，将两人迎进了同好会活动室。\n\n推开门，香甜的烘焙味道扑面而来。部长中须霞正端着一盘特制的夹心面包招待来客。众人围坐在桌旁享用茶点，轻松的气氛瞬间消解了跨藩奔波的疲惫。可可顺势切入正题：“说起来，先皇驾崩后，决定未来的神皇大选马上就要开始了，虹咲的各位有什么打算吗？”\n\n“其实……我们还没想好呢。”高咲侑挠了挠头，一脸苦恼地摊开双手，“本来想着要不先在藩内选一个代表出来，可大家每个人都那么让人悸动，只选一个人的话根本选不出来啊！”堇顺势接过话茬，提议道：“既然虹咲内部难以抉择，那不如大家一致对外，把选票集中投给外藩候选人如何？”\n\n“诶？”略显惊讶的步梦眨了眨眼，“难道说，小堇你们结丘打算参选神皇吗？”“才不是呢！”可可连忙摆手，把好几份报纸拍在桌上，“是我前阵子在海外报纸上看到，各国列强根本瞧不起我们学园偶像，觉得北方像一盘散沙，一定会输给南方的乐队派！可可就想着，我们必须团结起来，让全世界见识学园偶像的光芒！”\n\n同好会众人的眼神顿时认真起来——虽然大家性格迥异，但喜爱学园偶像的心意却是相通的。优木雪菜开口问道：“这样的话，可可同学心里应该已经有合适的人选了吧？”“当然！”可可紧接着把推举穗乃果的计划和理由告知众人，侑听得两眼放光，同好会全员也很快达成了默契。\n\n眼看串联第一站大功告成，可可长舒一口气，起身穿上大衣，“既然虹咲的大家也支持，那事不宜迟，我们这就赶去沼津拜访Aqours！之后电报联系，也欢迎大家到结丘作客~”\n\n“等等！”钟岚珠突然站起身，自信满满地叉起腰，“要团结全北方的话，光靠你们结丘不够吧？我也跟你们一起去吧？由两个藩国的代表联袂出面，对沼津来说才更有说服力嘛！”平安名堇看着眼前两个一唱一和的赛莲斯少女，忍不住扶额叹了口气——"
 NIS.4.a: "“怎么到头来，最替早樱神皇大选操心的变成你们赛莲斯人了啊！”"
 NIS.5.t: "予测不可能Driving!"
 NIS.5.desc: "凉爽的海风拂过沼津藩邸，黑泽黛雅正端坐在案前批阅公文。前几日结丘与虹咲先后发来电报称将出使造访，在她看来，无非是例行交好或来采购特产，稍微招待即可。\n\n“那个…姐姐。”黑泽露比探进半个脑袋，怯生生地说，“结丘藩和虹咲藩派来的特使已经到了。”“辛苦露比了，请她们进来吧。”黛雅放下笔，温柔一笑。“好的！来者貌似是结丘藩的唐可可小姐和虹咲藩的钟岚珠小姐呢。”露比乖巧地应了一声退下。\n\n唐…可可？钟岚珠？黛雅的眉头顿时紧锁——等等，这两个藩国派来的使节，竟然全是纯正的赛莲斯人名？传闻虹咲有个挥金如土的莲门大小姐，莫非…大陆势力想趁先皇驾崩之际插手早樱内政？\n\n正思忖间，门扉再度拉开。两位衣着华丽的赛莲斯少女走在前头，而紧随其后的是正嘀咕着“Galaxy!”的金发少女。看到这个奇怪组合，黛雅脑海中瞬间拼凑出一个合理推论：赛莲斯人自己没有竞选神皇的资格，所以特意挑了这位看起来颇具气度的少女当傀儡代理人，跑来拉拢沼津选票！\n\n“露比，你先出去吧。”黛雅支开妹妹，请三人落座斟茶。她先抿了一口茶，锐利的目光不断打量着堇：相貌端庄，礼仪尚可，但难当大任…黛雅放下茶杯轻咳一声，摆出参勤交代时的端庄礼仪说道：“二位赛莲斯使节不远万里，带着这位…气度不凡的小姐莅临沼津，所为何事啊？”\n\n“当然是为了神皇选举来的嘛。”岚珠直球接话，可可紧跟着凑上前：“没错，我们想请沼津在此事上配合——”\n\n“两位阁下，我就直说吧。”黛雅突然气场全开，直接截断了话头，“请你们放弃吧。我们Aqours是绝对不会输，也不会退让的！”“哎？可我们还什么都没说呢！”可可一头雾水，“我们根本没打算参选啊！”黛雅嘴角微扬，果然还在演，就在她正要揭穿这桩“惊天阴谋”时，可可急得先喊出了底牌：“我们是想全北方共同推举音乃藩的高坂穗乃果啊！”\n\n黛雅闻言猛地一倒头，“——什么？！推举穗乃果？你们怎么不早说啊！”“喂！刚才是谁信誓旦旦地说绝不退让的啊！”平安名堇忍不住吐槽。黛雅傲娇地侧过头辩解：“那…那是作为学园偶像团体的较量！但如果论引领早樱的个人魅力，全天下没人比得过穗乃果小姐！”“那就是说，沼津藩同意咯？”岚珠顺势追问。黛雅别过头轻哼一声：“当…当然了！就算你们不来，我们本来也打算支持音乃藩的…”\n\n这场“跨国阴谋”就此消弭于无形。当晚，三人与Aqours全员共进了晚餐，并在此留宿了一晚。第二天，高海千歌作为沼津代表带着几袋蜜柑，和三人一同踏上了前往音乃木坂的旅途…"
 NIS.5.a: "这还真是无法预测的展开呢…"
 NIS.6.t: "满怀“love”接近中！"
 NIS.6.desc: "“为什么会变成这样子啊！”黄昏时刻的音乃木坂，四道风尘仆仆的身影正在街头巷尾穿梭，“可可怎么知道！谁能想到火车晚点了啊！”四人一路小跑，终于赶在日落前推开了音乃藩枢机处的大门。\n\n正留在房内处理政务文件的海未、小鸟和妮可闻声同时抬起头。小鸟露出温柔的笑容：“请问…有什么事吗？”一旁的海未目光则扫过千歌手里那几袋蜜柑，瞬间猜出了来客身份，一本正经的提醒道：“虽说事先发了电报，但进门前也请先敲声门比较好。”\n\n“请、请问高坂穗乃果在吗？”缓过来气的千歌急切问道。“穗乃果？她的话今天已经回去了哦，说是要帮家里处理杂物和制作新品…”妮可双手抱胸答道。海未则合上文书看向几位来客，“诸位远道而来，究竟是有什么要紧事？”作为“团长”的可可立刻挺直腰板：“我们是代表结丘、虹咲、沼津三藩，特地赶来支援穗乃果参选神皇的！”海未虽然感到吃惊，但很快冷静下来：“虽然确实是关乎国家未来的大事，但完全可以加急电报沟通，诸位何必大老远亲自跑一趟…”\n\n“因为有些心意，不亲口站在对方面前说出来是传达不到的！”可可高举起一只拳头，“而且，我们要一起捍卫学园偶像的尊严！”话音刚落，原本坐在后方的妮可瞬间窜了过来，“等等！捍卫学园偶像的尊严…到底怎么回事？”\n\n片刻后，众人围坐在桌旁，一边剥着千歌带来的沼津蜜柑，一边听可可讲起了整场旅途的来龙去脉。说到激动处，可可立刻从包里掏出那几张已经皱巴巴的海外报纸拍在桌上。妮可凑近一看，小脸瞬间气得通红：“可恶！这帮家伙懂什么早樱偶像啊！一定要让他们见识见识，学园偶像到底拥有怎样的力量！”说完，妮可得意地哼了一声，心里更是乐开了花——还没等自己让绘里联络各藩，她们就主动上门了，学园偶像果然要崛起啦！\n\n一旁的海未和小鸟见状相视一笑。这半个月来，穗乃果一直因为舍不得和大家分开而对参选犹豫不决，可眼下有这么多跋山涉水赶来的朋友替她鼓劲，那个总是回应他人期待的穗乃果，一定也能下定决心吧！\n\n“事不宜迟！”妮可当机立断一挥手，“趁天还没完全黑，最好现在就去穗乃果家把事情搞定！”“那这里剩下的公文就交给我们吧，路上小心哦。”海鸟二人目送一行五人兴冲冲地跑出府邸。在妮可的带领下，几名少女穿过城下町，最终在挂着“穗村”牌匾的小店前停了下来。妮可回头看了众人一眼，深吸一口气，伸手推开了店门——"
 NIS.6.a: "“打扰了——”"
 NIS.7.t: "实现吧！大家的梦想——"
 NIS.7.desc: "第七盒…好！终于折好了！接下来只要把礼盒搬到柜台下面就好了！穗村的柜台后面，高坂穗乃果正系着围裙、包着头巾，帮爸爸妈妈提前准备明天要用的点心盒。穗乃果刚托起盒子，门扉便伴随着风铃声被人推开。\n\n“欢迎光——哎？！”穗乃果回过头，话说到一半突然卡住，“这不是妮可酱吗？后面还跟着四个没见过的同学…是妮可的朋友吗？欢迎光临！快进来坐坐，要吃点什么？”\n\n“不，她们可不是来吃点心的。”妮可双手叉腰，露出标志性的得意笑容，“她们是特地来见你的。”“哎？我？”穗乃果指了指自己，就在她还一脸困惑的时候，站在妮可身后的橙发少女便上前递出一袋蜜柑，脸上洋溢着和穗乃果如出一辙的笑容：“初次见面，穗乃果同学，我是来自沼津的高海千歌！”\n\n面对这突如其来的亲切感，穗乃果也下意识放下盒子接过了蜜柑，“你、你好！我是高坂穗乃果！”紧接着，后面的可可、堇与岚珠也依次报上了自己的姓名与来处。在众人的你一言我一语中，穗乃果很快听明白了她们是如何跨越半个北方、一路来到音乃木坂的。\n\n“哇啊，为了我的事情，竟然让大家跑了这么远的路，真是抱歉抱歉…”穗乃果有些不好意思地挠了挠头。“道什么歉嘛！”岚珠直球接话，“你可不是一个人在战斗——整个北方的学园偶像，可都站在你身后呢！”\n\n……是啊，事到如今，自己还有什么好犹豫的呢？看着眼前这几张满怀热忱的脸庞，穗乃果忽然想起了半个月前，妮可对她说出的那番话。原本还以为只是遥不可及的畅想，可眼下，来自各地的学园偶像竟然真的跨越山海聚在了这里——原来，妮可的理想已经实实在在地变成了现实！\n\n既然这场相聚都能成真，那哪怕前往京州之后九个人会暂时分开，穗乃果也毫不怀疑，大家一定能实现那个约定，重新站上最巅峰的舞台！而且，看着大家方才谈起偶像时那副不甘心的模样，穗乃果才猛然发觉——在“拯救学校”这个最初的目标之下，自己的心中早已潜藏着一颗同样纯粹、真正热爱学园偶像的心。\n\n“好——我明白了！”穗乃果抱紧怀里的蜜柑，对众人露出了笑容：“为了实现大家的梦想，神皇选举，我参加！Fight哒哟！”\n\n“太好了——！”千歌和可可瞬间欢呼击了个掌。岚珠和堇也相视一笑，而倚靠在门边的妮可看到这一幕，嘴角也忍不住微微扬起——这段日子的努力总算没有白费，自己当初的眼光，果然没有看错。加油吧，穗乃果！"
 NIS.7.a: "向昨日挥手道别，继续迈步向前吧！"