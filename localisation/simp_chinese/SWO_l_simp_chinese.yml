 SWO_black_foaming_night: "黑沫夜的余波"
 SWO_black_foaming_night_desc: "\n\n\n£SWO_black_foaming_night_topbar\n\n\n\n\n佐嘉虽然在§0黑沫夜的冲击§!中侥幸躲过一劫，但其造成的间接影响仍令本就脆弱的佐嘉社会雪上加霜。\n外藩工业崩溃导致大批青年失业返乡，无所事事的游民成了黑帮壮大的绝佳温床。商业的凋敝更令走私贸易愈发猖獗，“春雨”的海盗船频繁出没于近海从事人口买卖，使治安进一步恶化。\n尽管§Z“佐嘉事变”§!肃清了旧士族，但留给巽幸太郎和FranChouchou的却是一笔堆积如山的巨额赤字。若不能尽快重整商贸、荡平匪患，新生的政权终将在飙升的物价与社会秩序崩溃中走向死亡。"
 SWO_decaying_domain: "衰败的藩国"
 SWO_decaying_domain_desc: "\n\n\n£SWO_decaying_domain_topbar\n\n\n\n\n§R跨过三濑峠与俵坂，即使是奈落地狱也要远赴与我相见？§!\n\n£SKR_saga_texticon §Z佐嘉§!曾是早樱列岛最富庶的明珠之一，凭借锁国时代两百年独享的通商特权，各路商贾曾在此汇聚一堂。然而，3053年的《§C亲善通商条约§!》彻底击碎了建立在泡沫上的繁荣，面对邻近港口的倾轧，资源匮乏的佐嘉迅速败下阵来，作坊连片倒闭、航道日渐荒废。\n3079年，旧士族借民间恐慌趁机发难，强行暂停了五年一次的偶像选战，成立“元老会议”独揽大权。这使得佐嘉在3080年代成了全早樱唯一一个由守旧士族掌权的藩国。\n而当外部来客深入这片土地，便会发现这里的一切仿佛都停滞在了3053年。开国后席卷南方的工业化浪潮未曾垂青于此，成千上万的青年被迫背井离乡谋求生机，留给佐嘉的，只有在泥潭中无法自拔的封闭社会。"
 SWO_dorami: "“怒罗美”组织"
 SWO_dorami_desc: "\n\n\n£SWO_dorami_topbar\n\n\n\n\n“怒罗美”成立于3087年，黑沫夜波及佐嘉后，社会治安日趋恶化，官匪勾结欺压民众。在不良少年中声望颇高的二阶堂联不甘目睹权贵压榨百姓，加之怀揣“称霸全国”的梦想，遂与好友雾岛丽子携手组建了“怒罗美”。\n自成立之日起，“怒罗美”便将惩恶扬善立为宗旨，屡次出击同歌舞伎町的地痞流氓对抗，解救受欺凌的百姓，它也因此在佐嘉下层百姓中声名鹊起。\n3089年，特攻队长二阶堂咲被“拯救佐嘉、干碎无能老东西”的热血大义所打动，加入了正策划夺权的巽幸太郎，并很快率部下攻入藩厅，登上了藩主之位。\n如今的“怒罗美”已被改编为佐嘉巡防队，尽管他们的散漫作风与引擎轰鸣有时令人头疼不已，但绝无任何人质疑这支淬炼的青少年近卫军随时为守护佐嘉与藩主而战的决心。"
 SWO_zombie_land_saga_project: "“佐嘉偶像是传奇”计划"
 SWO_zombie_land_saga_project_desc: "\n\n\n£SWO_zombie_land_saga_project_topbar\n\n\n\n\n§Z若是今日会被历史所铭记，便将这燃烧的耀眼光芒刻入其中吧！§!\n\n§Z“佐嘉偶像是传奇”§!计划，又称“Zombie Land SAGA”计划，是巽幸太郎于3089年提出的一份拯救藩国企划。\n该计划以偶像团体§ZFranChouchou§!的活动为绝对核心，旨在以早樱传统的偶像政权与偶像经济重振藩国。\n借由大选年的契机，FranChouchou不仅顺势拿下了礼乐奉行所认证的“金印文书”，更以雷霆之钧肃清了藩政，用一场场公演重新唤醒了佐嘉民众心中的自豪。\n然而，这绝非故事的终点，纵使前路仍有风暴，但在向死而生的少女们身后，已是被重新点燃的万家灯火。她们必将斩断命运赋予的枷锁，在这片土地上铸就奇迹，涅槃为§Y真正的传奇§!。"